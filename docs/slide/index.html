<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사내 문서 AI 검색, 이렇게 동작합니다</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="deck"></div>
<div id="modal"><div class="modal-inner"><button class="close" onclick="document.getElementById('modal').classList.remove('on')">✕</button><div class="svgwrap"></div><div class="modal-title"></div></div></div>
<script>
/* ───────── 다이어그램 빌더 ─────────
   노드 종류
     (기본)  제목 + 보조 줄, 가운데 정렬. tone:true 면 연한 색 배경. shape:'db' 는 원통
     text    왼쪽 정렬 줄 목록. [[강조]] = 노드 색, {{강조}} = 주황
     rows    [라벨, 값] 표
     bars    [이름, 점수, 색, 메모] 막대
     chips   [라벨, [조각…]] 단어 조각.  *강조  ~떼어냄  !잘못 쪼개짐  →화살표  >메모
     doc     문서 모양 (sections)
     panel   제목만 있는 빈 판 (extras 로 내용을 그린다)
*/
const TINT={blue:'#2563eb',green:'#16a34a',amber:'#d97706',violet:'#7c3aed',rose:'#e11d48',neutral:'#52525b'};
const SOFT={blue:'#eff4ff',green:'#effaf2',amber:'#fff6e8',violet:'#f5f0ff',rose:'#fff1f3',neutral:'#f6f6f7'};
const EDGE_SOFT={blue:'#bfd2fb',green:'#b7e4c4',amber:'#f6d39d',violet:'#d9c8fb',rose:'#fbc3cf',neutral:'#e4e4e7'};
const SPEED=.35;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tw=(s,fs=14)=>[...String(s)].reduce((a,ch)=>a+(ch.charCodeAt(0)>0x7f?fs*1.0:fs*.56),0);
const mk=(s,col)=>esc(s).replace(/\[\[(.+?)\]\]/g,`<tspan fill="${col}" font-weight="700">$1</tspan>`).replace(/\{\{(.+?)\}\}/g,`<tspan fill="${TINT.amber}" font-weight="700">$1</tspan>`);
const side=(n,s,p=.5)=>s==='r'?[n.x+n.w,n.y+n.h*p]:s==='l'?[n.x,n.y+n.h*p]:s==='t'?[n.x+n.w*p,n.y]:[n.x+n.w*p,n.y+n.h];
const autoSide=(n,p)=>{const dx=p[0]-(n.x+n.w/2),dy=p[1]-(n.y+n.h/2);return Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'b':'t')};
function route(e,m){
  const a=m[e.from],b=m[e.to]; if(!a||!b) throw new Error('edge '+e.from+'→'+e.to);
  const via=e.via||[], ac=[a.x+a.w/2,a.y+a.h/2], bc=[b.x+b.w/2,b.y+b.h/2];
  const fs=e.fromSide||autoSide(a,via[0]||bc), ts=e.toSide||autoSide(b,via[via.length-1]||ac);
  const s=side(a,fs,e.fromPos??.5), t=side(b,ts,e.toPos??.5);
  let pts=[s,...via,t];
  if(!via.length){
    const h1=fs==='l'||fs==='r', h2=ts==='l'||ts==='r';
    if(h1&&h2){ if(Math.abs(s[1]-t[1])>1){const mx=(s[0]+t[0])/2;pts=[s,[mx,s[1]],[mx,t[1]],t];} }
    else if(!h1&&!h2){ if(Math.abs(s[0]-t[0])>1){const my=(s[1]+t[1])/2;pts=[s,[s[0],my],[t[0],my],t];} }
    else if(h1) pts=[s,[t[0],s[1]],t]; else pts=[s,[s[0],t[1]],t];
  }
  return pts;
}
const pathD=p=>p.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join(' ');
const plen=p=>{let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L};
function pmid(p){const h=plen(p)/2;let a=0;for(let i=1;i<p.length;i++){const s=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(a+s>=h){const r=(h-a)/s;return [p[i-1][0]+(p[i][0]-p[i-1][0])*r,p[i-1][1]+(p[i][1]-p[i-1][1])*r]}a+=s}return [p[0][0],p[0][1]]}
const star=(cx,cy,r)=>{let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)}return d+'Z'};

function frame(n,col){
  const fill=n.tone?SOFT[n.color]:'#fff', stroke=n.strong?col:(n.tone?EDGE_SOFT[n.color]:'#e4e4e7');
  if(n.shape==='db'){const cx=n.x+n.w/2;return `<path d="M${n.x} ${n.y+14} a${n.w/2} 14 0 0 1 ${n.w} 0 v${n.h-28} a${n.w/2} 14 0 0 1 -${n.w} 0 z" fill="${SOFT[n.color]}" stroke="${EDGE_SOFT[n.color]}" stroke-width="2"/><ellipse cx="${cx}" cy="${n.y+14}" rx="${n.w/2}" ry="14" fill="#fff" stroke="${EDGE_SOFT[n.color]}" stroke-width="2"/>`}
  return `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="16" fill="${fill}" stroke="${stroke}" stroke-width="${n.strong?2.4:1.6}"/>`;
}
const head=(n,col)=>n.title?`<text x="${n.x+24}" y="${n.y+38}" font-size="${n.tfs||17}" font-weight="700" fill="${col}">${mk(n.title,col)}</text>`:'';
const lnT=(t,k)=>`style="--t:${(t+.15+k*.07).toFixed(2)}s"`;

function renderNode(n){
  const col=TINT[n.color]||TINT.neutral, t0=(n.t||0)*SPEED;
  let inner='';
  if(n.kind==='text'){
    const fs=n.fs||19, lh=n.lh||Math.round(fs*1.7);
    inner+=head(n,col);
    let y=n.y+(n.title?78:44);
    (n.lines||[]).forEach((ln,k)=>{
      if(ln!=='') inner+=`<g class="ln" ${lnT(t0,k)}><text x="${n.x+24}" y="${y}" font-size="${fs}" font-weight="500" fill="#27272a" style="white-space:pre${n.mono?';font-family:var(--mono)':''}">${mk(ln,col)}</text></g>`;
      y+=lh;
    });
  }else if(n.kind==='rows'){
    const fs=n.fs||19, lh=n.lh||60, lw=n.lw||170;
    inner+=head(n,col);
    let y=n.y+(n.title?92:48);
    (n.rows||[]).forEach((r,k)=>{
      inner+=`<g class="ln" ${lnT(t0,k)}>
        ${k?`<line x1="${n.x+20}" y1="${y-lh/2-8}" x2="${n.x+n.w-20}" y2="${y-lh/2-8}" stroke="#f0f0f2" stroke-width="1.5"/>`:''}
        <text x="${n.x+24}" y="${y}" font-size="${fs-2}" font-weight="700" fill="#71717a">${esc(r[0])}</text>
        <text x="${n.x+24+lw}" y="${y}" font-size="${fs}" font-weight="500" fill="#18181b" ${r[2]?'style="font-family:var(--mono)"':''}>${mk(r[1],col)}</text></g>`;
      y+=lh;
    });
  }else if(n.kind==='bars'){
    inner+=head(n,col);
    const lw=n.lw||250, bx=n.x+24+lw, bw=n.w-48-lw-70;
    let y=n.y+(n.title?96:52);
    (n.items||[]).forEach((it,k)=>{
      const c=it[2]==='neutral'?'#a1a1aa':(TINT[it[2]]||'#a1a1aa');
      inner+=`<g class="ln" ${lnT(t0,k*1.5)}>
        <text x="${n.x+24}" y="${y}" font-size="19" font-weight="600" fill="#18181b">${esc(it[0])}</text>
        ${it[3]?`<text x="${n.x+24}" y="${y+22}" font-size="14" font-weight="600" fill="${c}">${esc(it[3])}</text>`:''}
        <rect x="${bx}" y="${y-16}" width="${bw}" height="20" rx="10" fill="#f4f4f5"/>
        <rect x="${bx}" y="${y-16}" width="${(bw*it[1]).toFixed(1)}" height="20" rx="10" fill="${c}"/>
        <text x="${bx+bw+14}" y="${y}" font-size="19" font-weight="500" fill="${c}" style="font-family:var(--mono)">${it[1].toFixed(2)}</text></g>`;
      y+=n.lh||64;
    });
  }else if(n.kind==='chips'){
    inner+=head(n,col);
    const lw=n.lw||200, fs=n.fs||19;
    let y=n.y+(n.title?72:30);
    (n.rows||[]).forEach((r,k)=>{
      let x=n.x+24+lw, g='';
      g+=`<text x="${n.x+24}" y="${y+26}" font-size="16" font-weight="700" fill="#71717a">${esc(r[0])}</text>`;
      r[1].forEach(raw=>{
        const p=raw[0], marked='*~!>'.includes(p), s=marked?raw.slice(1):raw;
        if(raw==='→'){g+=`<text x="${x+4}" y="${y+27}" font-size="22" fill="#a1a1aa">→</text>`;x+=36;return}
        if(p==='>'){g+=`<text x="${x+4}" y="${y+26}" font-size="17" font-weight="600" fill="${TINT.amber}">${esc(s)}</text>`;x+=tw(s,17)+16;return}
        const w=tw(s,fs)+26;
        const [bg,fg,deco]=p==='*'?[SOFT.blue,TINT.blue,'']:p==='~'?['#f4f4f5','#a1a1aa','line-through']:p==='!'?[SOFT.rose,TINT.rose,'']:['#fff','#27272a',''];
        g+=`<rect x="${x}" y="${y}" width="${w}" height="40" rx="10" fill="${bg}" stroke="${marked?'none':'#e4e4e7'}"/>
            <text x="${x+w/2}" y="${y+27}" font-size="${fs}" font-weight="600" text-anchor="middle" fill="${fg}" ${deco?`text-decoration="${deco}"`:''}>${esc(s)}</text>`;
        x+=w+10;
      });
      inner+=`<g class="ln" ${lnT(t0,k*2)}>${g}</g>`;
      y+=n.lh||64;
    });
  }else if(n.kind==='doc'){
    inner+=`<text x="${n.x+24}" y="${n.y+42}" font-size="21" font-weight="700" fill="#18181b">${esc(n.title)}</text>
      <text x="${n.x+24}" y="${n.y+66}" font-size="14" font-weight="500" fill="#a1a1aa">${esc(n.sub||'')}</text>`;
    let y=n.y+88;
    (n.sections||[]).forEach((s,k)=>{
      const hi=s.hi, bg=hi?SOFT.blue:'#fafafa', st=hi?EDGE_SOFT.blue:'#f0f0f2';
      let bars='';
      for(let i=0;i<s.lines;i++){const w=(n.w-80)*(i===s.lines-1?.55:.92-(i%2)*.12);bars+=`<rect x="${n.x+38}" y="${y+46+i*20}" width="${w.toFixed(0)}" height="8" rx="4" fill="${hi?'#c9d8fb':'#e4e4e7'}"/>`}
      inner+=`<g class="ln" ${lnT(t0,k)}><rect x="${n.x+16}" y="${y}" width="${n.w-32}" height="${s.h}" rx="10" fill="${bg}" stroke="${st}" stroke-width="1.5"/>
        <text x="${n.x+38}" y="${y+30}" font-size="17" font-weight="700" fill="${hi?TINT.blue:'#52525b'}">${esc(s.label)}</text>${bars}</g>`;
      y+=s.h+12;
    });
  }else if(n.kind==='panel'){
    inner+=head(n,col);
  }else{
    const subs=n.sub?String(n.sub).split('\n'):[], cx=n.x+n.w/2, fs=n.fs||23, sl=24;
    const ty=n.y+n.h/2-(subs.length*sl)/2+(subs.length?2:8)+(n.shape==='db'?10:0);
    inner+=`<text x="${cx}" y="${ty}" font-size="${fs}" font-weight="700" letter-spacing="-.01em" text-anchor="middle" fill="#18181b">${esc(n.title)}</text>
      ${subs.map((s,k)=>`<text x="${cx}" y="${ty+30+k*sl}" font-size="17" font-weight="500" text-anchor="middle" fill="#71717a">${mk(s,col)}</text>`).join('')}`;
  }
  return `<g class="n" style="--t:${t0.toFixed(2)}s">${frame(n,col)}${inner}</g>`;
}

function diagram(spec){
  const w=spec.w||1380,h=spec.h||730,m={};
  (spec.groups||[]).forEach(g=>m[g.id]=g);(spec.nodes||[]).forEach(n=>m[n.id]=n);
  let out='';
  (spec.groups||[]).forEach(g=>{
    const gc=TINT[g.color]||'#71717a';
    out+=`<g class="g-grp" style="--t:${((g.t||0)*SPEED).toFixed(2)}s"><rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="18" fill="${SOFT[g.color]||'#fafafa'}" stroke="${EDGE_SOFT[g.color]||'#e4e4e7'}" stroke-width="1.5" stroke-dasharray="6 6"/>
      <text x="${g.x+24}" y="${g.y+36}" font-size="19" font-weight="700" fill="${gc}">${esc(g.label||'')}</text></g>`;
  });
  (spec.edges||[]).forEach(e=>{
    const pts=route(e,m),d=pathD(pts),t=+((e.t||0)*SPEED).toFixed(2),t2=(t+.35).toFixed(2),dur=Math.max(1.1,Math.min(2.2,plen(pts)/300)).toFixed(2);
    const col=TINT[e.color]||TINT.blue;
    out+=`<g><path d="${d}" pathLength="1" fill="none" stroke="#d4d4d8" stroke-width="2.4" class="e-draw" style="--t:${t}s" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" class="e-flow" style="--t2:${t2}s" marker-end="url(#m-${col.slice(1)})" stroke-linejoin="round"/>
      ${e.noPacket?'':`<circle r="6" fill="${col}" class="pk" style="--t2:${t2}s;--dur:${dur}s;offset-path:path('${d}')"/>`}`;
    if(e.label){
      const [mx,my]=pmid(pts),lw=tw(e.label,16)+26,lh=34;
      const lx=e.lx??mx-lw/2,ly=e.ly??my-lh/2;
      out+=`<g class="e-lbl" style="--t2:${t2}s"><rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" rx="17" fill="#fff" stroke="${EDGE_SOFT[e.color]||EDGE_SOFT.blue}" stroke-width="1.5"/>
        <text x="${lx+lw/2}" y="${ly+23}" font-size="16" font-weight="600" text-anchor="middle" fill="${col}">${esc(e.label)}</text></g>`;
    }
    out+='</g>';
  });
  (spec.nodes||[]).forEach(n=>out+=renderNode(n));
  (spec.extras||[]).forEach(x=>out+=`<g class="note" style="--t:${((x.t||0)*SPEED).toFixed(2)}s">${x.svg}</g>`);
  (spec.notes||[]).forEach(n=>{
    out+=`<g class="note" style="--t:${((n.t||0)*SPEED).toFixed(2)}s"><text x="${n.x}" y="${n.y}" font-size="${n.fs||17}" font-weight="500" fill="${TINT[n.color]||'#71717a'}" ${n.anchor?`text-anchor="${n.anchor}"`:''}>${mk(n.text,TINT.blue)}</text></g>`;
  });
  const markers=Object.values(TINT).map(c=>`<marker id="m-${c.slice(1)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><defs>${markers}</defs>${out}</svg>`;
}

/* ───────── 임베딩 장표의 '뜻 지도' ───────── */
const pt=(x,y,c,label,dx=16)=>`<circle cx="${x}" cy="${y}" r="10" fill="${c}"/><text x="${x+dx}" y="${y+6}" font-size="18" font-weight="600" fill="#27272a" ${dx<0?'text-anchor="end"':''}>${label}</text>`;
const MAP_EXTRAS=[
  {t:1.8,svg:`<circle cx="960" cy="270" r="140" fill="${SOFT.blue}" stroke="${EDGE_SOFT.blue}" stroke-width="2" stroke-dasharray="6 6"/>
     <text x="960" y="116" font-size="18" font-weight="700" fill="${TINT.blue}" text-anchor="middle">장애 · 오류 이야기</text>`},
  {t:2.1,svg:pt(905,225,TINT.blue,'장애 → PM 보고')},
  {t:2.4,svg:pt(1005,300,TINT.blue,'오류 시 연락 절차')},
  {t:2.7,svg:`<circle cx="1180" cy="510" r="100" fill="${SOFT.green}" stroke="${EDGE_SOFT.green}" stroke-width="2" stroke-dasharray="6 6"/>
     <text x="1180" y="396" font-size="18" font-weight="700" fill="${TINT.green}" text-anchor="middle">사내 생활 안내</text>`},
  {t:2.9,svg:pt(1140,488,TINT.green,'회의실 예약')},
  {t:3.0,svg:pt(1215,550,TINT.green,'식대 정산',-16)},
  {t:3.8,svg:`<path d="${star(940,360,20)}" fill="${TINT.amber}"/><text x="968" y="368" font-size="19" font-weight="700" fill="${TINT.amber}">질문</text>
     <line x1="935" y1="340" x2="908" y2="240" stroke="${TINT.amber}" stroke-width="2.4" stroke-dasharray="5 5"/>`},
  {t:4.2,svg:`<text x="1060" y="672" font-size="17" font-weight="500" fill="#71717a" text-anchor="middle">점이 가까울수록 뜻이 비슷합니다 · 질문(★)과 가까운 글을 찾아옵니다</text>`},
];

/* ───────── 클러스터링 장표의 문서 지도 ───────── */
const rnd=seed=>{let x=seed;return()=>{x=(x*9301+49297)%233280;return x/233280}};
const dots=(cx,cy,n,seed,sp,c)=>{const r=rnd(seed);let o='';for(let i=0;i<n;i++){const a=r()*6.283,d=Math.sqrt(r())*sp;o+=`<circle cx="${(cx+Math.cos(a)*d).toFixed(0)}" cy="${(cy+Math.sin(a)*d*.8).toFixed(0)}" r="8" fill="${c}"/>`}return o};
const CL=[[190,190,9,11,75,'blue'],[445,215,8,23,70,'green'],[310,375,7,37,62,'violet']];
const halo=(c)=>`<ellipse cx="${c[0]}" cy="${c[1]}" rx="${c[4]+28}" ry="${(c[4]+28)*.8}" fill="${SOFT[c[5]]}" stroke="${EDGE_SOFT[c[5]]}" stroke-width="2" stroke-dasharray="6 6"/>`;
const CLUSTER_EXTRAS=[
  {t:1.2,svg:CL.map(c=>dots(c[0],c[1],c[2],c[3],c[4],'#a1a1aa')).join('')},
  {t:2.8,svg:CL.map(c=>halo(c)+dots(c[0],c[1],c[2],c[3],c[4],TINT[c[5]])).join('')},
  {t:4.6,svg:`<text x="190" y="104" font-size="17" font-weight="700" fill="${TINT.blue}" text-anchor="middle">장애 대응 · 운영</text>
     <text x="445" y="130" font-size="17" font-weight="700" fill="${TINT.green}" text-anchor="middle">클라우드 인프라</text>
     <text x="205" y="400" font-size="17" font-weight="700" fill="${TINT.violet}" text-anchor="end">MES 제안 · 견적</text>`},
];


const Q='장애 나면 누구한테 에스컬레이션해?';

  ['01','한눈에 보기','전체 흐름'],
  ['02','문서 나누기','청킹'],

];

const SLIDES=[
{kind:'title'},

/* 1 한눈에 보기 */
{num:'01',crumb:'한눈에 보기',title:'한눈에 보기',
 easy:'AI 가 모든 문서를 외우는 게 아닙니다. 질문할 때마다 <b>관련 글을 찾아</b> 건네주고, <b>"이 글만 보고 답해"</b> 라고 시킵니다.',
 ko:['한국어 검색이 잘 되도록 단계마다 손을 봤습니다','어떤 부분인지는 장표마다 이 칸에서 설명합니다'],
 notes:'위쪽은 평소에 자동으로 돌아가는 준비 작업, 아래쪽은 질문할 때 일어나는 일입니다. 도서관에 책을 정리해 꽂아 두고, 질문이 오면 찾아서 읽고 답한다고 생각하면 됩니다.',
 diagram:{groups:[
   {id:'g1',x:20,y:20,w:1340,h:310,label:'① 미리 정리해 두기 (자동으로 주기적으로)',color:'green',t:0},
   {id:'g2',x:20,y:400,w:1340,h:310,label:'② 질문하면 (몇 초 안에)',color:'blue',t:2.4},
 ],nodes:[

/* ───────── 렌더 ───────── */
const deck=document.getElementById('deck');
let cur=0;
const bar=(crumb,right)=>`<div class="bar"><div class="mark">K</div><span class="name">Confluence <span style="color:var(--primary)">KB</span></span><span class="crumb">› ${esc(crumb)}</span><div class="right">${right||''}</div></div>`;

function rTitle(){
  return `<div class="slide">${bar('소개','')}
    <div class="hero"><div class="over">부서 공유 · Confluence 지식 검색</div>
      <h1>사내 문서 AI 검색,<br><span>이렇게 동작합니다</span></h1>
      <div class="lead">Confluence 문서를 찾아 읽고, 출처를 달아 답해 주는 과정을 차례로 살펴봅니다</div>
    </div>
    <div class="agenda">${AGENDA.map((a,i)=>`<div class="it" style="animation-delay:${.7+i*.1}s"><div class="n">${a[0]}</div><div class="t">${esc(a[1])}</div><div class="a">${esc(a[2])}</div></div>`).join('')}</div>
    <div class="example">질문 하나로 끝까지 따라갑니다 — <b>"${esc(Q)}"</b></div>
  </div>`;
}
function rFlow(s,i){
  return `<div class="slide">${bar(s.crumb,`<span class="pill">${esc(s.num)}</span>`)}
    <div class="head"><h1>${esc(s.title)}${s.tech?`<small>${esc(s.tech)}</small>`:''}</h1></div>
    <div class="body">
      <div class="diagram"><div class="svgwrap"></div></div>
      <div class="side">
        <div class="card easy" style="animation-delay:.2s"><h4>쉽게 말하면</h4><p>${s.easy}</p></div>
        <div class="card ko" style="animation-delay:.4s"><h4>${s.koTitle||'한글은 이렇게'}</h4><ul>${s.ko.map(p=>`<li>${p}</li>`).join('')}</ul></div>
      </div>
    </div></div>`;
}
function build(){
  deck.innerHTML=SLIDES.map((s,i)=>s.kind==='title'?rTitle():rFlow(s,i)).join('')+
  `<div id="notes"><small>발표자 노트 · N 키로 숨김</small><span id="nb"></span></div>
   <div class="foot"><button class="btn" id="prev">◀ 이전</button>
   <div class="dots" id="dots">${SLIDES.map(()=>'<i></i>').join('')}</div><span id="pos"></span><button class="btn primary" id="next">다음 ▶</button></div>`;
  document.getElementById('prev').onclick=()=>go(cur-1);
  document.getElementById('next').onclick=()=>go(cur+1);
}
function openModal(i){
  const modal=document.getElementById('modal');
  modal.querySelector('.svgwrap').innerHTML=diagram(SLIDES[i].diagram);
  modal.querySelector('.modal-title').textContent=SLIDES[i].title||'';
  modal.classList.add('on');
}
function show(i){
  const slides=[...deck.querySelectorAll('.slide')];
  slides.forEach((el,k)=>el.classList.toggle('active',k===i));
  const el=slides[i]; el.outerHTML=el.outerHTML;
  const fresh=[...deck.querySelectorAll('.slide')][i], d=fresh.querySelector('.diagram');
  if(d){ d.querySelector('.svgwrap').innerHTML=diagram(SLIDES[i].diagram); d.onclick=()=>openModal(i); }
  [...document.getElementById('dots').children].forEach((x,k)=>x.classList.toggle('on',k===i));
  document.getElementById('pos').textContent=`${i+1} / ${SLIDES.length}`;
  document.getElementById('nb').textContent=SLIDES[i].notes||'';
  document.getElementById('next').style.visibility=i===SLIDES.length-1?'hidden':'visible';
  document.getElementById('prev').style.visibility=i===0?'hidden':'visible';
  location.hash='#'+(i+1);
}
function go(i){ if(i<0||i>=SLIDES.length) return; cur=i; show(cur); }
function fit(){ const s=Math.min(innerWidth/2000,innerHeight/1080); deck.style.transform=`scale(${s})`; deck.style.left=((innerWidth-2000*s)/2)+'px'; deck.style.top=((innerHeight-1080*s)/2)+'px'; }
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='r'||e.key==='R') show(cur);
  else if(e.key==='n'||e.key==='N') document.getElementById('notes').classList.toggle('on');
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(e.key==='Home') go(0); else if(e.key==='End') go(SLIDES.length-1);
  else if(e.key==='Escape') document.getElementById('modal').classList.remove('on');
});
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('on')};
if(location.search.includes('static')){const st=document.createElement('style');st.textContent='*{animation-duration:0s!important;animation-delay:0s!important}.pk{display:none}';document.head.appendChild(st);}
build(); fit();
const h0=parseInt((location.hash||'#1').slice(1),10); go(isNaN(h0)?0:Math.min(Math.max(h0-1,0),SLIDES.length-1));
</script>
